<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:A;src:url(../../_ds/brandeez-design-system-fbe1068f-90f0-4bec-97b9-453ac5cf9fae/assets/fonts/archivo-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:A;src:url(../../_ds/brandeez-design-system-fbe1068f-90f0-4bec-97b9-453ac5cf9fae/assets/fonts/archivo-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:A;src:url(../../_ds/brandeez-design-system-fbe1068f-90f0-4bec-97b9-453ac5cf9fae/assets/fonts/archivo-latin-700-normal.woff2) format("woff2");font-weight:700}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#1F2235}
body{font-family:A,sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:
  radial-gradient(520px 420px at 900px 250px,rgba(227,164,25,.34),transparent 70%),
  radial-gradient(700px 500px at 0 700px,rgba(46,50,80,.95),transparent 70%),
  linear-gradient(135deg,#1B1E30,#1F2235 55%,#262A41)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px;mask:radial-gradient(800px 500px at 900px 300px,#000,transparent)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(243,211,137,.55) 1px,transparent 1.5px);background-size:37px 41px;opacity:.18}
.left{position:absolute;left:72px;top:64px;bottom:60px;width:640px;display:flex;flex-direction:column}
.logo{height:26px;width:auto;align-self:flex-start}
.tag{margin-top:46px;display:flex;align-items:center;gap:14px;font-weight:600;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:#BAB6B6}
.tag:before{content:"";width:36px;height:3px;background:#E3A419}
h1{margin-top:18px;font-weight:800;text-transform:uppercase;letter-spacing:-.035em;line-height:.9;font-size:var(--fs,92px)}
h1 em{font-style:normal;color:#E3A419}
.sub{margin-top:20px;font-weight:600;font-size:21px;line-height:1.35;color:#D7D3D3;max-width:600px}
.foot{margin-top:auto;display:flex;gap:34px;align-items:flex-end}
.stat b{display:block;font-weight:800;font-size:38px;letter-spacing:-.03em;color:#E3A419;line-height:1}
.stat span{display:block;margin-top:6px;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#9B9797}
.url{position:absolute;right:64px;bottom:56px;font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:12px}
.url i{width:10px;height:10px;border-radius:50%;background:#E3A419;box-shadow:0 0 18px #E3A419}
/* 3D logo */
.stage{position:absolute;left:720px;top:70px;width:420px;height:420px;perspective:1100px}
.logo3d{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transform:rotateX(14deg) rotateY(-30deg) rotateZ(-4deg)}
.bar{position:absolute;transform-style:preserve-3d;--w:170px;--h:54px;--d:56px}
.bar .f{position:absolute;left:0;top:0;border-radius:7px}
.fr{width:var(--w);height:var(--h);transform:translateZ(calc(var(--d)/2));background:linear-gradient(170deg,#FBE3A6 0%,#F0C14E 22%,#E3A419 55%,#B57F0E 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -6px 12px rgba(120,80,5,.45)}
.bk{width:var(--w);height:var(--h);transform:rotateY(180deg) translateZ(calc(var(--d)/2));background:#6B4A08}
.tp{width:var(--w);height:var(--d);transform:rotateX(90deg) translateZ(calc(var(--d)/2));top:calc((var(--h) - var(--d))/2);background:linear-gradient(90deg,#F8DA8F,#EBBD4F 60%,#C9900F)}
.bt{width:var(--w);height:var(--d);transform:rotateX(-90deg) translateZ(calc(var(--h)/2));top:calc((var(--h) - var(--d))/2);background:#5A3E06}
.rt{width:var(--d);height:var(--h);transform:rotateY(90deg) translateZ(calc(var(--w) - var(--d)/2));left:0;background:linear-gradient(180deg,#B78310,#7A560A)}
.lt{width:var(--d);height:var(--h);transform:rotateY(-90deg) translateZ(calc(var(--d)/2));background:linear-gradient(180deg,#D9A21C,#9A6C0B)}
.shadow{position:absolute;left:770px;top:470px;width:360px;height:60px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%);filter:blur(6px)}
</style></head>
<body>
<div class="bg"></div><div class="grid"></div><div class="dots"></div>
<div class="left">
  <img class="logo" src="../../assets/wordmark-on-dark.svg" alt="">
  <div class="tag" id="tag">Creative agency · Dubai</div>
  <h1 id="h1">We build brands people <em>choose.</em></h1>
  <div class="sub" id="sub">Branding · Content · SEO · Ads · Social · Automation · Web</div>
  <div class="foot" id="foot">
    <div class="stat"><b>$2M+</b><span>Client revenue</span></div>
    <div class="stat"><b>50+</b><span>Brands scaled</span></div>
    <div class="stat"><b>10+</b><span>Countries</span></div>
  </div>
</div>
<div class="shadow"></div>
<div class="stage"><div class="logo3d" id="logo"></div></div>
<div class="url"><i></i>brandeeze.com</div>
<script>
// Build the 6-bar brand mark in CSS 3D
const L=document.getElementById('logo');const W=170,H=54,GX=22,GY=36;
for(let i=0;i<6;i++){const col=i<3?0:1,row=i%3;const b=document.createElement('div');b.className='bar';
  const x=(col?GX/2:-W-GX/2),y=(row-1)*(H+GY)-H/2,z=(row-1)*-10+(col?14:-14);
  b.style.transform=`translate3d(${x}px,${y}px,${z}px)`;b.innerHTML='<div class="f fr"></div><div class="f bk"></div><div class="f tp"></div><div class="f bt"></div><div class="f rt"></div><div class="f lt"></div>';L.appendChild(b)}
// Parameters: ?tag=&h1=&sub=&foot=
const q=new URLSearchParams(location.search);
if(q.get('tag'))document.getElementById('tag').textContent=q.get('tag');
if(q.get('h1'))document.getElementById('h1').innerHTML=q.get('h1');
if(q.get('sub'))document.getElementById('sub').textContent=q.get('sub');
if(q.get('foot'))document.getElementById('foot').innerHTML=q.get('foot').split('|').map(s=>{const[a,b]=s.split('~');return`<div class="stat"><b>${a}</b><span>${b}</span></div>`}).join('');
const len=document.getElementById('h1').textContent.length;document.body.style.setProperty('--fs',(len>48?54:len>38?62:len>28?70:80)+'px');
</script>
</body></html>
